<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio | Bienvenido</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #0b0e14; 
            color: #ffffff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }

        /* Estilo para tu imagen del planeta */
        .img-planeta {
            width: 250px; /* Un poco más grande para que luzca el planeta */
            height: 250px;
            border-radius: 50%; 
            border: 2px solid #50d8d7;
            object-fit: cover;
            /* Efecto de resplandor espacial */
            box-shadow: 0 0 30px rgba(80, 216, 215, 0.4); 
            margin-bottom: 25px;
            transition: transform 0.5s ease;
        }

        .img-planeta:hover {
            transform: rotate(10deg) scale(1.05); /* El planeta gira un poco al pasar el mouse */
        }

        h1 { color: #50d8d7; margin: 10px 0; }
        p { color: #a0a0a0; max-width: 400px; text-align: center; line-height: 1.6; }

        .btn {
            margin-top: 30px;
            padding: 12px 30px;
            background-color: #50d8d7;
            color: #0b0e14;
            text-decoration: none;
            border-radius: 50px; /* Botón más redondeado, estilo moderno */
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #ffffff;
            letter-spacing: 1px; /* El texto se separa un poco al tocarlo */
        }
    </style>
</head>
<body>

    <img src="fondoplaneta.jpg" alt="Planeta de Bienvenida" class="img-planeta">

    <h1>¡Bienvenidos!</h1>
    <p> prueba 1.</p>

    <a href="proyecto.html" class="btn">ENTRAR</a>

</body>
</html>
