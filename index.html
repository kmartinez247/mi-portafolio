<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio | Bienvenido</title>
    <style>
        /* Estilos Generales */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #0f172a; /* Azul muy oscuro */
            color: #f8fafc; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }

        /* Estilo de la Imagen */
        .perfil {
            width: 180px;
            height: 180px;
            border-radius: 50%; /* La hace circular */
            border: 4px solid #38bdf8; /* Borde celeste brillante */
            object-fit: cover; /* Evita que la foto se deforme */
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            margin-bottom: 20px;
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; color: #38bdf8; }
        p { font-size: 1.2rem; color: #94a3b8; max-width: 500px; text-align: center; }

        /* Estilo del Botón */
        .btn {
            margin-top: 30px;
            padding: 12px 24px;
            background-color: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #0ea5e9;
            transform: translateY(-3px); /* Efecto de levitación */
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <img src="perfil.jpg" alt="Foto de Bienvenida" class="perfil">

    <h1>¡Bienvenido a mi Nave!</h1>
